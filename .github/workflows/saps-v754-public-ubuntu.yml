name: SAPS v7.54 private-source acceptance (public Ubuntu runners) # same-repo PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/saps-v754-public-ubuntu.yml
  push:
    branches:
      - task/saps-v754-public-ubuntu-acceptance
    paths:
      - .github/workflows/saps-v754-public-ubuntu.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private spine-animator-private branch, tag or commit SHA to validate
        required: true
        default: feature/saps-v754-parallel-integration-20261123
        type: string

permissions:
  contents: read

concurrency:
  group: saps-v754-public-ubuntu-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: SpineAnimator/spine-animator-private
  SOURCE_REF: ${{ github.event.inputs.source_ref || 'feature/saps-v754-parallel-integration-20261123' }}

jobs:
  saps-real-psd-conversion:
    name: SAPS parse, raster and real PSD compatibility gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private-source read token
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          test -n "$SOURCE_REPO_TOKEN" || { echo "::error::Configure SOURCE_REPO_TOKEN in this public runner repository with read-only access to SpineAnimator/spine-animator-private."; exit 1; }
      - name: Checkout exact private source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install 'psd-tools>=1.10,<2' 'Pillow>=10.3,<14'
      - name: PSD layer tree and PNG extraction tests
        run: python -m unittest discover -s tests -p 'test_psd_v754_tree.py' -v
      - name: PNG geometry and deterministic ZIP tests
        run: python -m unittest discover -s tests -p 'test_psd_spine_packaging.py' -v
      - name: Verify real PSD conversion preserves duplicate source names without renaming
        shell: bash
        run: |
          set -euo pipefail
          python tools/psd-spine/extract_psd_tree.py tests/fixtures/etalons/cherry/source.psd "$RUNNER_TEMP/saps-cherry-tree" --workers 2
          python - "$RUNNER_TEMP/saps-cherry-tree/psd-v754-tree.json" <<'PY'
          import json,sys
          tree=json.load(open(sys.argv[1]))
          assert tree['source']['format']=='PSD'
          assert tree['node_count']==7
          def walk(nodes):
              for item in nodes:
                  assert item.get('layerId')
                  if item.get('imagePath'):
                      assert item.get('raster',{}).get('png_sha256')
                  walk(item.get('children',[]))
          walk(tree['children'])
          print('REAL_PSD_TREE_AND_PARALLEL_RASTERS_VALID')
          PY
          python tools/psd-spine/convert_psd_to_spine.py tests/fixtures/etalons/cherry/source.psd "$RUNNER_TEMP/saps-cherry-spine43.zip" --workers 2
          python - "$RUNNER_TEMP/saps-cherry-spine43.zip" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None
              skeleton=json.loads(archive.read('skeleton.json'))
              manifest=json.loads(archive.read('manifest.json'))
          names=[item['name'] for item in manifest['layer_inventory']]
          orn_layers=[item for item in manifest['layer_inventory'] if item.get('name')=='orn']
          orn_jobs=[item for item in manifest['raster_jobs'] if item.get('sourceLayerName')=='orn']
          orn_slots=[item for item in skeleton['slots'] if item['name']=='orn' or item['name'].startswith('orn__src_')]
          assert len(names)==7, names
          assert len(orn_layers)==2, orn_layers
          assert len({item['layerId'] for item in orn_layers})==2
          assert len(orn_jobs)==2, orn_jobs
          assert len({item['destination'] for item in orn_jobs})==2
          assert len(orn_slots)==2, orn_slots
          assert len({item['name'] for item in skeleton['slots']})==len(skeleton['slots'])
          assert all(item['attachment']=='orn' for item in orn_slots)
          assert not any(name=='orn__2' for name in names)
          print('REAL_PSD_DUPLICATE_ORN_PRESERVED_NO_SOURCE_LAYER_RENAMING')
          print('REAL_PSD_SPINE43_ZIP_INTEGRITY_PASS')
          PY

  v754-export-semantics:
    name: v7.54 tag, hierarchy and raster mapping contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private-source read token
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          test -n "$SOURCE_REPO_TOKEN" || { echo "::error::Configure SOURCE_REPO_TOKEN in this public runner repository with read-only access to SpineAnimator/spine-animator-private."; exit 1; }
      - name: Checkout exact private source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/v754-exporter.test.mjs

  ai-source-readiness:
    name: Per-layer CV, semantic hypotheses and AI gate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private-source read token
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          test -n "$SOURCE_REPO_TOKEN" || { echo "::error::Configure SOURCE_REPO_TOKEN in this public runner repository with read-only access to SpineAnimator/spine-animator-private."; exit 1; }
      - name: Checkout exact private source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/vision.test.cjs tests/vision-pixel-distance.test.cjs tests/sa-agent.test.cjs tests/sa-agent-runtime.test.cjs
      - name: Validate plan workflow per-layer CV source and manifest join
        run: |
          node --input-type=module --check < workers/plan-workflow-test/index.js
          node --test tests/plan-workflow-layer-review.test.mjs
      - name: Visual gate must fail closed without trusted render/model evidence
        run: node --test tests/visual-gate.test.cjs

  spine43-export-runtime:
    name: Spine 4.3 JSON and package invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private-source read token
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          test -n "$SOURCE_REPO_TOKEN" || { echo "::error::Configure SOURCE_REPO_TOKEN in this public runner repository with read-only access to SpineAnimator/spine-animator-private."; exit 1; }
      - name: Checkout exact private source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/continuous-spine-zip.test.cjs tests/export-contract.test.cjs tests/scene-export.test.cjs

  acceptance-summary:
    name: All parallel SAPS gates
    runs-on: ubuntu-24.04
    needs:
      - saps-real-psd-conversion
      - v754-export-semantics
      - ai-source-readiness
      - spine43-export-runtime
    if: always()
    steps:
      - name: Require every independent Ubuntu job to pass
        env:
          PSD: ${{ needs.saps-real-psd-conversion.result }}
          V754: ${{ needs.v754-export-semantics.result }}
          AI: ${{ needs.ai-source-readiness.result }}
          SPINE: ${{ needs.spine43-export-runtime.result }}
        run: |
          printf 'SAPS real PSD: %s\nv7.54 semantics: %s\nAI readiness contracts: %s\nSpine 4.3 runtime contracts: %s\n' "$PSD" "$V754" "$AI" "$SPINE"
          test "$PSD" = success
          test "$V754" = success
          test "$AI" = success
          test "$SPINE" = success
