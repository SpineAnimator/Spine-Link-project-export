name: Public Ubuntu Spine-Link project export checks
on:
  workflow_call:
    secrets:
      SOURCE_REPO_TOKEN:
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner.yml'
      - 'tests/test_public_runner_contract.py'
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      upload_id:
        description: Private queue item identifier
        required: false
        type: string
  repository_dispatch:
    types: [spine-project-export]
permissions:
  contents: read
concurrency:
  group: private-spine-link-executor
  cancel-in-progress: false
jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public runner workflow contract (RED)
        run: python -m unittest discover -s tests -p test_public_runner_contract.py -v
      - run: |
          set -euo pipefail
          echo "Public ephemeral runner allocated: $RUNNER_NAME ($RUNNER_OS)"
          uname -s
  execute-private-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private source credential
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Required Actions secret SOURCE_REPO_TOKEN is not configured; private checkout cannot run."
            exit 1
          fi
      - name: Checkout private source from 3Spine-core
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            scripts/spine-link-project-queue.mjs
            scripts/spine-link-project-cloud-export.mjs
            scripts/spine-editor-export.mjs
            tests/spine-link-project-queue.test.mjs
            tests/spine-editor-export.test.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run private Spine-Link contract tests
        working-directory: private-source
        run: |
          set -euo pipefail
          node --check scripts/spine-link-project-cloud-export.mjs
          node --test tests/spine-link-project-queue.test.mjs tests/spine-editor-export.test.mjs
